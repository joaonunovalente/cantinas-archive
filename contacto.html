	<section class="theme-section">

						<form action="https://api.web3forms.com/submit" method="POST">
							<input type="hidden" name="access_key" value="a8d39281-0c9c-45ba-82e3-0b5a5ff4fdf6">

							<div class="mb-3 text-start">
								<label class="form-label">Nome</label>
								<input type="text" name="nome" class="form-control" required>
							</div>

							<div class="mb-3 text-start">
								<label class="form-label">Email</label>
								<input type="email" name="email" class="form-control" required>
							</div>

							<div class="mb-3 text-start">
								<label class="form-label">Mensagem</label>
								<textarea name="mensagem" rows="4" class="form-control" required></textarea>
							</div>
							<div class="mt-4">
								<button type="submit" class="btn btn-primary w-100">Enviar</button>
							</div>
						</form>
						<p class="mt-4 mb-0">
							Ou envia um email para <br>
							<a href="mailto:contacto@cantinas.pt" class="fw-semibold">
